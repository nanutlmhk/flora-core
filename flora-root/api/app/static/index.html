<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flora Root</title>
<style>
  :root { --bg:#f6f7f4; --panel:#ffffff; --ink:#1d2621; --muted:#65706a; --line:#e2e6e1; --accent:#2f6f4f;
          --ok:#2f7d4f; --warn:#a46a12; --bad:#b23b3b; --chip:#eef2ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121614; --panel:#1a201d; --ink:#e4ebe6; --muted:#9aa59f;
          --line:#2a332e; --accent:#6dbb8f; --ok:#6dbb8f; --warn:#e0a84a; --bad:#e07a7a; --chip:#232b27; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap }
  header h1 { font-size:18px; margin:0 } header span { color:var(--muted) }
  main { padding:20px 24px; display:grid; gap:18px; max-width:1200px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; overflow-x:auto }
  h2 { font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted) }
  table { width:100%; border-collapse:collapse } th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top }
  th { font-weight:600; color:var(--muted); font-size:12px } td.num { font-variant-numeric:tabular-nums }
  .chip { display:inline-block; padding:1px 8px; border-radius:999px; background:var(--chip); font-size:12px; margin:1px 2px 1px 0 }
  .ok { color:var(--ok) } .warn { color:var(--warn) } .bad { color:var(--bad) } .muted { color:var(--muted) }
  button { font:inherit; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent) } button.danger { color:var(--bad) }
  form.lic { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-top:8px } form.lic label { display:grid; font-size:12px; color:var(--muted) }
  form.lic input { width:90px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink) }
  pre { margin:0; white-space:pre-wrap; font:12px ui-monospace,Menlo,monospace } code { font:12px ui-monospace,Menlo,monospace; word-break:break-all }
  .bar { height:6px; background:var(--chip); border-radius:3px; width:120px; margin-top:4px } .bar i { display:block; height:100%; border-radius:3px; background:var(--accent) }
</style>
</head>
<body>
<header><h1>Flora Root</h1><span>Cloud control plane · tenants, licenses, global configuration</span><span id="ts" class="muted"></span></header>
<main>
  <section><h2>Tenants</h2><div id="tenants">Loading…</div></section>
  <section><h2>Global configuration</h2><div id="config"></div></section>
  <section><h2>Signing key</h2><div id="keys"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const when = (ms) => ms ? new Date(ms).toLocaleString() : "—";
const ago = (ms) => { if (!ms) return "never"; const s = Math.round((Date.now() - ms) / 1000); return s < 90 ? `${s}s ago` : `${Math.round(s / 60)} min ago`; };
let editing = null;

function usage(used, max) {
  const pct = max ? Math.min(100, Math.round(100 * used / max)) : 0;
  const cls = used > max ? "bad" : "";
  return `<span class="${cls}">${used ?? 0} / ${max}</span><div class="bar"><i style="width:${pct}%"></i></div>`;
}

async function load() {
  const data = await (await fetch("api/v1/overview")).json();
  $("ts").textContent = "updated " + new Date(data.server_ts).toLocaleTimeString();
  $("tenants").innerHTML = `<table><tr><th>Tenant</th><th>License</th><th>Leaves</th><th>Gateways</th><th>Gateway devices</th><th>Canopy check-in</th><th></th></tr>${
    data.tenants.map((t) => {
      const u = t.usage || {};
      const expired = t.revoked_at || t.expires_at < Date.now();
      const status = t.revoked_at ? `<span class="bad">revoked</span>` : expired ? `<span class="bad">expired</span>` : `<span class="ok">valid</span> until ${when(t.expires_at)}`;
      const synced = t.canopy_bundle_id === t.bundle_id ? "" : `<div class="warn">Canopy still on ${esc(t.canopy_bundle_id || "—")}</div>`;
      const online = t.last_seen_at && Date.now() - t.last_seen_at < 90000;
      return `<tr><td><b>${esc(t.name)}</b><div class="muted">${esc(t.tenant_id)} · ${esc(t.region)}</div></td>
        <td>${status}<div><code>${esc(t.bundle_id)}</code></div>${synced}<div>${(t.modules || []).map((m) => `<span class="chip">${esc(m)}</span>`).join("")}</div>
            <div class="muted">${(t.device_types || []).length} device types</div></td>
        <td class="num">${usage(u.leaves, t.max_leaves)}</td><td class="num">${usage(u.gateways, t.max_gateways)}</td>
        <td class="num">${usage(u.gateway_devices, t.max_gateway_devices)}</td>
        <td><span class="${online ? "ok" : "warn"}">${ago(t.last_seen_at)}</span><div class="muted">${esc(t.canopy_version || "")}</div></td>
        <td><button onclick="edit('${esc(t.tenant_id)}')">Edit license</button> <button class="danger" onclick="revoke('${esc(t.tenant_id)}')">Revoke</button></td></tr>
        ${editing === t.tenant_id ? `<tr><td colspan="7"><form class="lic" onsubmit="return save(event,'${esc(t.tenant_id)}')">
          <label>Max leaves<input name="max_leaves" type="number" value="${t.max_leaves}"></label>
          <label>Max gateways<input name="max_gateways" type="number" value="${t.max_gateways}"></label>
          <label>Max gateway devices<input name="max_gateway_devices" type="number" value="${t.max_gateway_devices}"></label>
          <label>Valid days<input name="valid_days" type="number" value="365"></label>
          <button class="primary">Issue new bundle</button> <button type="button" onclick="editing=null;load()">Cancel</button></form>
          <div class="muted">Canopy picks up the new bundle on its next sync; gateways get their share on their next check-in.</div></td></tr>` : ""}`;
    }).join("")}</table>`;
  window.tenants = Object.fromEntries(data.tenants.map((t) => [t.tenant_id, t]));
  $("config").innerHTML = `<table>${data.global_config.map((c) => `<tr><td><b>${esc(c.key)}</b></td><td><pre>${esc(JSON.stringify(c.value, null, 2))}</pre></td><td class="muted">${when(c.updated_at)}</td></tr>`).join("")}</table>`;
  $("keys").innerHTML = data.signing_keys.map((k) => `<div><b>${esc(k.key_id)}</b> · Ed25519 · created ${when(k.created_at)}</div><code>${esc(k.public_raw)}</code>`).join("");
}
function edit(id) { editing = id; load(); }
async function save(event, id) {
  event.preventDefault();
  const form = new FormData(event.target);
  const t = window.tenants[id];
  const body = { modules: t.modules, device_types: t.device_types };
  for (const [k, v] of form) body[k] = Number(v);
  const r = await fetch(`api/v1/tenants/${id}/license`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) alert(await r.text());
  editing = null; load(); return false;
}
async function revoke(id) {
  if (!confirm(`Revoke the current license for ${id}? Its gateways stop their device parsers on the next sync.`)) return;
  await fetch(`api/v1/tenants/${id}/license/revoke`, { method: "POST" }); load();
}
load(); setInterval(() => { if (!editing) load(); }, 5000);
</script>
</body>
</html>
