# Flora Root — cloud control plane: tenants, licenses, global configuration.
# Ports: 71xx (see ../demo/PORTS.md). Run: docker compose up -d --build
name: flora-root

services:
  root-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: flora_root
      POSTGRES_USER: flora_root
      POSTGRES_PASSWORD: ${FLORA_ROOT_DB_PASSWORD:-flora-root-local-only}
    ports:
      - "127.0.0.1:${FLORA_ROOT_DB_PORT:-7102}:5432"
    volumes:
      - root_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora_root -d flora_root"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  root-api:
    build:
      context: ./api
    image: flora-root-api:dev
    environment:
      FLORA_ROOT_DATABASE_URL: postgresql://flora_root:${FLORA_ROOT_DB_PASSWORD:-flora-root-local-only}@root-db:5432/flora_root
      # Empty = admin API open (demo only). Set a long random value anywhere else.
      ROOT_ADMIN_KEY: ${ROOT_ADMIN_KEY:-}
      ROOT_SEED_DEMO: ${ROOT_SEED_DEMO:-true}
      ROOT_DEMO_TENANT_ID: ${ROOT_DEMO_TENANT_ID:-hospital-01}
      ROOT_DEMO_TENANT_KEY: ${ROOT_DEMO_TENANT_KEY:-root-tenant-demo-key}
    ports:
      # Published on all interfaces: every Canopy calls Root here.
      - "${FLORA_ROOT_PORT:-7100}:8000"
    depends_on:
      root-db: {condition: service_healthy}
    restart: unless-stopped

volumes:
  root_db_data:
