<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flora-app.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flora 1.2.1</title>

    <!--
      Apply the saved palette before first paint.
    -->
    <script>
      (function () {
        try {
          var savedColor = localStorage.getItem("theme-color");
          var colors = ["monochromatic", "neon", "warm", "pastel", "pink-pastel"];
          var color = colors.indexOf(savedColor) >= 0 ? savedColor : "monochromatic";
          var el = document.documentElement;
          el.classList.add(color === "pink-pastel" ? "light" : "dark");
          el.classList.add("theme-" + color);
        } catch (_) {}
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
