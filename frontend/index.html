<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flora-app.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flora 1.2.1</title>

    <!--
      THEME INIT — runs synchronously before first paint so the correct
      dark/light class and color theme are on <html> from frame 0.
      This eliminates the flash of the default blue-dark on every load.
    -->
    <script>
      (function () {
        try {
          var mode =
            localStorage.getItem("theme-mode") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          var savedColor = localStorage.getItem("theme-color");
          var color = savedColor === "nit" ? "nit" : savedColor === "eforl" ? "eforl" : "esm";
          var el = document.documentElement;
          el.classList.add(mode);
          el.classList.add("theme-" + color);
        } catch (_) {}
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
