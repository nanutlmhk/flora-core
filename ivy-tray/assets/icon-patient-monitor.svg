<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Patient Monitor - Light stroke for dark backgrounds -->
  <rect x="12" y="18" width="76" height="52" rx="7" fill="#B3E5FC" opacity="0.15"/>
  <rect x="12" y="18" width="76" height="52" rx="7" fill="none" stroke="#B3E5FC" stroke-width="3"/>
  <rect x="20" y="26" width="60" height="34" rx="3" fill="#0D2744"/>
  <!-- ECG waveform -->
  <polyline points="22,44 26,44 29,36 33,50 37,40 41,44 46,44 49,38 53,48 56,44 62,44 65,40 68,46 72,44 76,44" fill="none" stroke="#4FC3F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- SpO2 line -->
  <polyline points="22,55 28,53 34,57 40,54 46,56 52,53 58,56 64,54 70,56 76,55" fill="none" stroke="#81D4FA" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Status dots -->
  <circle cx="23" cy="29" r="2" fill="#00E5FF"/>
  <circle cx="28" cy="29" r="2" fill="#69F0AE" opacity="0.7"/>
  <!-- Stand neck -->
  <line x1="50" y1="70" x2="50" y2="80" stroke="#B3E5FC" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Base -->
  <rect x="35" y="78" width="30" height="8" rx="4" fill="none" stroke="#B3E5FC" stroke-width="2" opacity="0.4"/>
</svg>
