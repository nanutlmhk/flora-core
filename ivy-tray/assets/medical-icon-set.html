<!DOCTYPE html>

<title>Medical Icon Set</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0D1B2E;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 56px;
    padding: 56px;
  }
  h1 { color: #7EC8E3; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; font-weight: 300; opacity: 0.8; }
  .icon-row {
    display: flex;
    align-items: flex-start;
    gap: 60px;
  }
  .icon-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .icon-label {
    color: #7EC8E3;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    font-weight: 300;
  }
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }
  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .size-label { color: #4A7A8A; font-size: 9px; letter-spacing: 1px; }
  .divider-v {
    width: 1px;
    height: 160px;
    background: rgba(126,200,227,0.1);
    align-self: center;
  }
</style>
</head>
