<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Infusion Pump - Light stroke for dark backgrounds -->
  <!-- Body -->
  <rect x="26" y="8" width="48" height="76" rx="6" fill="#B3E5FC" opacity="0.1"/>
  <rect x="26" y="8" width="48" height="76" rx="6" fill="none" stroke="#B3E5FC" stroke-width="2.5"/>
  <!-- Pole clamp top -->
  <rect x="38" y="4" width="24" height="8" rx="4" fill="none" stroke="#B3E5FC" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="4" x2="50" y2="8" stroke="#B3E5FC" stroke-width="1.5" opacity="0.5"/>
  <!-- Screen -->
  <rect x="31" y="14" width="38" height="26" rx="3" fill="#071A2E" stroke="#4FC3F7" stroke-width="1.2"/>
  <!-- Drug label -->
  <rect x="34" y="17" width="16" height="4" rx="1" fill="#4FC3F7" opacity="0.35"/>
  <!-- Rate value -->
  <text x="50" y="30" fill="#4FC3F7" font-size="7" text-anchor="middle" font-family="monospace" font-weight="bold">125</text>
  <text x="50" y="36" fill="#81D4FA" font-size="4.5" text-anchor="middle" font-family="monospace" opacity="0.7">mL/hr</text>
  <!-- Status light -->
  <circle cx="64" cy="19" r="2" fill="#00E5FF"/>
  <circle cx="59" cy="19" r="2" fill="#B3E5FC" opacity="0.2"/>
  <!-- Buttons -->
  <rect x="31" y="46" width="16" height="9" rx="3" fill="none" stroke="#B3E5FC" stroke-width="1.5"/>
  <line x1="39" y1="49" x2="39" y2="52" stroke="#B3E5FC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="50.5" x2="42" y2="50.5" stroke="#B3E5FC" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="53" y="46" width="16" height="9" rx="3" fill="none" stroke="#B3E5FC" stroke-width="1.5"/>
  <line x1="61" y1="49" x2="61" y2="52" stroke="#B3E5FC" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Syringe slot -->
  <rect x="31" y="60" width="38" height="12" rx="3" fill="#B3E5FC" opacity="0.07" stroke="#B3E5FC" stroke-width="1"/>
  <rect x="34" y="63" width="24" height="6" rx="2" fill="none" stroke="#81D4FA" stroke-width="1" opacity="0.7"/>
  <rect x="58" y="64" width="6" height="4" rx="1" fill="none" stroke="#81D4FA" stroke-width="1" opacity="0.7"/>
  <rect x="34" y="64" width="16" height="4" rx="1" fill="#4FC3F7" opacity="0.15"/>
  <line x1="33" y1="63" x2="33" y2="69" stroke="#B3E5FC" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- IV tube -->
  <line x1="50" y1="84" x2="50" y2="94" stroke="#81D4FA" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="50" cy="96" rx="3.5" ry="2.5" fill="none" stroke="#81D4FA" stroke-width="1.5" opacity="0.7"/>
  <!-- IV pole (right) -->
  <rect x="74" y="18" width="4" height="58" rx="2" fill="none" stroke="#B3E5FC" stroke-width="1" opacity="0.3"/>
</svg>
