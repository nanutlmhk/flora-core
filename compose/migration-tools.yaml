services:
  sqlite-pgloader:
    image: dimitri/pgloader:latest
    profiles: ["migration"]
    command:
      - pgloader
      - sqlite:///source/${FLORA_SQLITE_SNAPSHOT:-flora-postgres-migration.db}
      - postgresql://${FLORA_POSTGRES_ADMIN_USER:-flora_admin}:${FLORA_POSTGRES_ADMIN_PASSWORD:-flora-admin-local-only}@postgres:5432/${FLORA_MIGRATION_TARGET_DB:-flora}
    volumes:
      - flora_dev_data:/source
    depends_on:
      postgres:
        condition: service_healthy

  postgres-post-import:
    image: postgres:17.6-alpine
    profiles: ["migration"]
    environment:
      PGPASSWORD: ${FLORA_POSTGRES_ADMIN_PASSWORD:-flora-admin-local-only}
      FLORA_DB_VIEW_PASSWORD: ${FLORA_DB_VIEW_PASSWORD:-flora-view-local-only}
      FLORA_DB_SYNC_PASSWORD: ${FLORA_DB_SYNC_PASSWORD:-flora-sync-local-only}
    command:
      - psql
      - --host=postgres
      - --username=${FLORA_POSTGRES_ADMIN_USER:-flora_admin}
      - --dbname=${FLORA_MIGRATION_TARGET_DB:-flora}
      - --set=ON_ERROR_STOP=1
      - --file=/migration/0001-post-import-indexes.sql
      - --file=/migration/0002-clinical-check-constraints.sql
      - --file=/migration/0003-create-view-role.sql
      - --file=/migration/0004-leaf-canopy-sync.sql
    volumes:
      - ../infrastructure/postgres:/migration:ro
    depends_on:
      postgres:
        condition: service_healthy

  migration-validator:
    build:
      context: ../services/flora-migration-validator
    profiles: ["migration"]
    environment:
      FLORA_SQLITE_PATH: /source/${FLORA_SQLITE_SNAPSHOT:-flora-postgres-migration.db}
      FLORA_DATABASE_URL: postgresql://${FLORA_POSTGRES_ADMIN_USER:-flora_admin}:${FLORA_POSTGRES_ADMIN_PASSWORD:-flora-admin-local-only}@postgres:5432/${FLORA_MIGRATION_TARGET_DB:-flora}
      FLORA_APP_ROLE: flora_app
      FLORA_VIEW_ROLE: flora_view
      FLORA_SYNC_ROLE: flora_sync
      FLORA_EXPECTED_CHECKS: "24"
    volumes:
      - flora_dev_data:/source:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  flora_dev_data:
