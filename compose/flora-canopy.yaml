services:
  flora-canopy-api:
    build:
      context: ../services/flora-api
    profiles: ["canopy"]
    environment:
      FLORA_DATABASE_URL: postgresql://flora_view:${FLORA_DB_VIEW_PASSWORD:-flora-view-local-only}@postgres:5432/${FLORA_POSTGRES_DB:-flora}
      FLORA_API_ENV: development
      FLORA_API_MODE: canopy
      FLORA_CANOPY_SESSION_SECRET: ${FLORA_CANOPY_SESSION_SECRET:-flora-canopy-dev-secret-change-me}
      FLORA_INNOVIAN_ARCHIVE_URL: ${FLORA_INNOVIAN_ARCHIVE_URL:-http://host.docker.internal:8000/api/v1}
      FLORA_INNOVIAN_ARCHIVE_SUBJECT: ${FLORA_INNOVIAN_ARCHIVE_SUBJECT:-hospital-nit}
      FLORA_INNOVIAN_ARCHIVE_KEY: ${FLORA_INNOVIAN_ARCHIVE_KEY:-}
      FLORA_INNOVIAN_MAX_CASE_MINUTES: ${FLORA_INNOVIAN_MAX_CASE_MINUTES:-1440}
    ports:
      - "127.0.0.1:${FLORA_CANOPY_API_PORT:-6895}:8000"
    volumes:
      - ../services/flora-api/app:/app/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  flora-canopy:
    build:
      context: ..
      dockerfile: Dockerfile.frontend.dev
    profiles: ["canopy"]
    ports:
      - "${FLORA_CANOPY_PORT:-6894}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_FLORA_SURFACE: canopy
      VITE_API_PROXY_TARGET: http://flora-canopy-api:8000
    volumes:
      - ../frontend:/app/frontend:ro
      - flora_canopy_frontend_modules:/app/frontend/node_modules
    depends_on:
      flora-canopy-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flora_canopy_frontend_modules:
