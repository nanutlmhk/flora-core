services:
  flora-leaf-api:
    build:
      context: ../services/flora-api
    environment:
      FLORA_DATABASE_URL: postgresql://flora_app:${FLORA_DB_APP_PASSWORD:-flora-app-local-only}@postgres:5432/${FLORA_POSTGRES_DB:-flora}
      FLORA_API_ENV: development
      FLORA_API_MODE: leaf
    ports:
      - "127.0.0.1:${FLORA_LEAF_API_PORT:-6893}:8000"
    volumes:
      - ../services/flora-api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
