services:
  flora-leaf:
    build:
      context: ..
      dockerfile: Dockerfile.frontend.dev
    ports:
      - "${FLORA_LEAF_PORT:-6890}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_FLORA_SURFACE: leaf
      VITE_API_PROXY_TARGET: http://backend:3001
    volumes:
      - ../frontend:/app/frontend
      - flora_frontend_modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flora_frontend_modules:
