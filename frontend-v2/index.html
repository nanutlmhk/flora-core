<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aidas - Beta 1 Version</title>

    <!--
      THEME INIT — runs synchronously before first paint so the correct
      dark/light class and color theme are on <html> from frame 0.
      This eliminates the flash of the default blue-dark on every load.
    -->
    <script>
      (function () {
        try {
          var mode =
            localStorage.getItem("theme-mode") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          var color = localStorage.getItem("theme-color") || "default";
          var el = document.documentElement;
          el.classList.add(mode);
          el.classList.add("theme-" + color);
        } catch (_) {}
      })();
    </script>

    <!-- ✅ LOAD INTER FONT (CRITICAL) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
